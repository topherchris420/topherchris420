name: Atlas coverage

# The atlas lists every public repository; the front page features a curated few.
# Each week this compares docs/atlas.json with the owner's public repositories and
# writes the differences to the job summary. A red run means a repository was
# published (or made private) since the atlas was last edited: read it, add or
# move its entry in docs/atlas.json, and run tools/build_atlas.py.

on:
  push:
    paths:
      - docs/atlas.json
      - tools/build_atlas.py
      - .github/workflows/atlas.yml
  schedule:
    - cron: "41 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Compare the atlas with public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build_atlas.py --discover
