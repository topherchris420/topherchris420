# Animated GitHub activity koi, powered by https://github.com/yalongwastaken/git-koi
name: Koi

on:
  schedule:
    # Show the last complete UTC day's activity.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1
        with:
          login: topherchris420
          body: asagi
          output-dir: koi
      - name: Commit the koi if it changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The README may change while git-koi is rendering. Always commit
          # the generated GIF on top of the latest main, never a stale checkout.
          # Keep the rendered file in the working tree across retries.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add koi/koi.gif
            if git diff --cached --quiet; then
              echo "The koi is already up to date; nothing to commit."
              exit 0
            fi

            git commit -m "koi: draw the day's koi"
            if git push origin HEAD:main; then
              echo "Published the koi on attempt $attempt."
              exit 0
            fi
            echo "main advanced while publishing; retrying ($attempt/3)."
          done

          echo "::error::Could not publish the koi after three attempts."
          exit 1
