  <title id="title">Vers3Dynamics — instruments for noticing</title>
  <desc id="description">An open-source resonant intelligence lab. Beside the name, a drawing of the Adinkra symbol Nea Onnim No Sua A, Ohu, an Akan symbol of knowledge and life-long learning: "one who does not know can know from learning". Shown on a dark background.</desc>
