<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Build time and evidence time</title>
  <desc id="description">A timeline chart. For each project, a short solid segment from first commit to first runnable version, and a longer path to the first controlled or external test, or a dashed question mark where that test has not happened. DRR: framework code day 0  ·  preregistered external test day 465: not supported. IONS-X: simulation day 0  ·  paired no-coupling controls day 281 (synthetic). R.A.I.N. Lab: meeting launcher day 0  ·  promotion gate day 222  ·  real-model accuracy: unmeasured. Pine Gap: 3D viewer day 0  ·  playable day 72  ·  agent finishes mission day 73  ·  success rate: one run so far. Project 33: engineering package day 0  ·  physical evidence artifacts: 0. Embedded AI Validation: simulated validation runs day 0  ·  measured power on hardware: planned. CIRCLE: Rev B design day 3  ·  physiology twin day 42  ·  fabrication: blocked by review gates.</desc>
  <rect width="960" height="600" rx="12" fill="#091A1D"/>
  <rect x="0.5" y="0.5" width="959" height="599" rx="11.5" stroke="#234044"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="46" fill="#ADC7C3" font-size="13" letter-spacing="2" font-weight="600">THE BUILD LINE IS SHORT. THE EVIDENCE LINE IS NOT.</text>
    <text x="40" y="78" fill="#E8F2ED" font-size="15">Days since each repository's first commit, from Git history.</text>
    <path d="M262.0 118 V528" stroke="#10292C" stroke-width="1"/>
