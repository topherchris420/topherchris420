    <text x="583" y="128" fill="#8BD5CC" font-size="20" font-weight="600" text-anchor="middle">validate</text>
    <text x="583" y="100" fill="#E8F2ED" font-size="16" text-anchor="middle">Pordenone</text>
    <circle cx="790" cy="158" r="15" stroke="#E8A87C" stroke-width="1.5"/>
