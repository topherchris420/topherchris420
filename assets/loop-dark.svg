<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" fill="none" role="img" aria-labelledby="title description">
  <title id="title">One loop, eight stages</title>
  <desc id="description">A loop of eight stages: observe, propose, validate, authorize, act, measure, preserve, replay, then back to observe. Each stage is labelled with selected projects that do their main work there. Observe: CIRCLE and Dynamic Resonance Rooting. Propose: R.A.I.N. Lab. Validate: Pordenone. Authorize, the one stage highlighted in a warm colour as belonging to a person: James and HumanTouch. Act: James and Pine Gap. Measure: TRIAD and Quantum Noise Profiler (QNP). Preserve: R.A.I.N. Lab and Anna. Replay: Mannahatta and rain-pipeline. Inside the loop: Intelligence may propose. Evidence must be checked. Authority stays with the human. Not every project implements every stage.</desc>
