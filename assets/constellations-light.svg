<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Five questions, one lab</title>
  <desc id="description">A map of Vers3Dynamics projects grouped around five questions. When should a machine's confidence count: R.A.I.N. Lab, Pordenone, Anna, Embedded AI Validation. How do signals move together: DRR, CIRCLE, IONS-X. What happens when agents have to live somewhere: Pine Gap, Lop Nur Twin, Mannahatta, Orpheus. What would have to be measured: Dynamic Location Theory, Woodyard model, hello_os, Project 33. At the centre, what does it sound like: music, Studio, Vanta. Rings mark projects sharing a typed-judgment layer (Jev): R.A.I.N. Lab, Pordenone, DRR, Pine Gap and Lop Nur Twin. A dashed arc marks the IONS-X correlation engine reused in CIRCLE.</desc>
